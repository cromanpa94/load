name: Update Status from Nextcloud

on:
  schedule:
    # Run every day at X UTC
    - cron: '0 17 * * 1-5'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths-ignore:
      - 'status.md'  # Avoid infinite loop when we commit status.md

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Download status file from Nextcloud
      run: |
        # Download the status.md file from Nextcloud WebDAV
        # Using curl with the public WebDAV endpoint
        curl -f -o status_new.md \
          "https://nextcloud.datadiversitylab.synology.me/public.php/dav/files/NFFLArX36qtzfLp/" \
          || echo "Failed to download file"
        
        # Check if download was successful
        if [ ! -f status_new.md ]; then
          echo "Download failed - keeping existing status.md"
          exit 1
        fi
    
    - name: Check for changes
      id: check_changes
      run: |
        # Compare the downloaded file with the existing one
        if [ -f status.md ]; then
          if cmp -s status_new.md status.md; then
            echo "No changes detected in status.md"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected in status.md"
            echo "changed=true" >> $GITHUB_OUTPUT
            # Show what changed for logging purposes
            echo "=== Changes detected ==="
            diff status.md status_new.md || true
            echo "======================="
          fi
        else
          echo "status.md does not exist, creating it"
          echo "changed=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Update status.md if changed
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        # Replace the old file with the new one
        mv status_new.md status.md
        
        # Validate the file format
        if grep -q "busy=" status.md && grep -q "mood=" status.md; then
          echo "Status file format validated"
        else
          echo "Warning: Status file may not have the expected format"
        fi
        
        # Display the content for logging
        echo "=== Updated status.md content ==="
        cat status.md
        echo "================================"
    
    - name: Update history if changed
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        # Parse current values from status.md
        BUSY=$(grep -o 'busy[[:space:]]*=[[:space:]]*[0-9]*' status.md | grep -o '[0-9]*')
        MOOD=$(grep -o 'mood[[:space:]]*=[[:space:]]*[0-9]*' status.md | grep -o '[0-9]*')
        
        # Parse note - handle quotes properly
        NOTE=$(grep -o 'note[[:space:]]*=[[:space:]]*"[^"]*"' status.md | sed 's/note[[:space:]]*=[[:space:]]*"//' | sed 's/"$//')
        # Escape any commas in the note for CSV format
        NOTE=$(echo "$NOTE" | sed 's/,/;/g')
        
        # Debug: Show parsed values
        echo "Parsed values - Busy: $BUSY, Mood: $MOOD, Note: $NOTE"
        
        # Calculate efficiency
        if [ "$BUSY" = "0" ] && [ "$MOOD" = "0" ]; then
          EFFICIENCY=0
        else
          EFFICIENCY=$(( (100 - BUSY + MOOD) / 2 ))
        fi
        
        echo "Calculated efficiency: $EFFICIENCY"
        
        # Create history.csv if it doesn't exist
        if [ ! -f history.csv ]; then
          echo "Creating new history.csv"
          echo "timestamp,busy,mood,efficiency,note" > history.csv
        fi
        
        # Append new data
        TIMESTAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
        echo "Adding: $TIMESTAMP,$BUSY,$MOOD,$EFFICIENCY,\"$NOTE\""
        echo "$TIMESTAMP,$BUSY,$MOOD,$EFFICIENCY,\"$NOTE\"" >> history.csv
        
        # Keep only last 365 entries (not including header)
        #if [ $(wc -l < history.csv) -gt 366 ]; then
        #  echo "Trimming history to last 365 entries"
        #  head -n 1 history.csv > history_temp.csv
        #  tail -n 365 history.csv >> history_temp.csv
        #  mv history_temp.csv history.csv
        #fi
        
        # Show the last few lines for debugging
        echo "Last 3 lines of history.csv:"
        tail -n 3 history.csv
                   
    - name: Commit and push if changed
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --global user.name 'GitHub Action'
        git config --global user.email 'action@github.com'
        git add status.md
        git add history.csv
        git commit -m "Update status data - $(date +'%Y-%m-%d %H:%M:%S UTC')"
        git push
